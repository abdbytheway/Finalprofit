
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RR Trading Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#020617;
    --sub:#475569;
    --accent:#38bdf8;
}
.dark{
    --bg:#0f172a;
    --card:#020617;
    --border:#1e293b;
    --text:#ffffff;
    --sub:#cbd5f5;
}
*{box-sizing:border-box;font-family:Poppins}
body{
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:40px;
}
.container{
    width:1000px;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}
h1{color:var(--accent)}

.switch{position:relative;width:50px;height:26px}
.switch input{opacity:0}
.slider{position:absolute;inset:0;background:#cbd5f5;border-radius:20px}
.slider:before{content:"";position:absolute;width:20px;height:20px;background:#fff;left:3px;bottom:3px;border-radius:50%;transition:.3s}
input:checked + .slider{background:var(--accent)}
input:checked + .slider:before{transform:translateX(24px)}

.section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    margin-bottom:20px;
    overflow:hidden;
}
.section h2{
    padding:20px;
    margin:0;
    cursor:pointer;
    background:rgba(56,189,248,.08);
}
.content{padding:25px;display:none}

input{
    padding:12px;
    width:100%;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#020617;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:center}
th{color:var(--accent)}

.resultBox{
    margin-top:20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
}
.rrow{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:14px;
}
.rrow span:last-child{font-weight:600}
.divider{height:1px;background:var(--border);margin:15px 0}
.rrow.total{color:var(--accent);font-size:16px;font-weight:600}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>RR Trading Suite</h1>
<label class="switch">
<input type="checkbox" onclick="document.body.classList.toggle('dark')">
<span class="slider"></span>
</label>
</div>

<!-- SINGLE TRADE -->
<div class="section">
<h2 onclick="toggle(this)">📌 Single Trade Profit</h2>
<div class="content">

<input id="scapital" placeholder="Trading Capital">
<input id="srisk" placeholder="Risk % per Trade">
<button onclick="singleCalc()">Calculate</button>

<div id="sresult" class="resultBox" style="display:none">
    <div class="rrow"><span>Total Risk</span><span id="sr"></span></div>
    <div class="rrow"><span>Profit at 1R (50%)</span><span id="s1"></span></div>
    <div class="rrow"><span>Profit at 3R (50%)</span><span id="s3"></span></div>
    <div class="divider"></div>
    <div class="rrow total"><span>Total Profit</span><span id="st"></span></div>
    <div class="rrow"><span>Effective RR</span><span>1 : 2</span></div>
</div>

</div>
</div>

<!-- GROWTH -->
<div class="section">
<h2 onclick="toggle(this)">📈 Growth & Compounding</h2>
<div class="content">

<input id="gcapital" placeholder="Initial Capital">
<input id="grisk" placeholder="Risk % per Trade">
<input id="gtrades" placeholder="Number of Trades">

<button onclick="growthCalc()">Calculate</button>
<button onclick="downloadExcel()">Download Excel</button>

<table id="gtable" style="display:none">
<thead>
<tr>
<th>#</th>
<th>Start</th>
<th>Risk</th>
<th>1R Profit</th>
<th>3R Profit</th>
<th>Total Profit</th>
<th>End</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>
</div>

</div>

<script>
function toggle(el){
    const c=el.nextElementSibling;
    c.style.display=c.style.display==="block"?"none":"block";
}

function singleCalc(){
    let c=parseFloat(scapital.value), r=parseFloat(srisk.value);
    if(!c||!r) return alert("Enter valid numbers");
    let risk=c*(r/100), half=risk/2;
    let p1=half, p3=half*3, total=p1+p3;
    sr.innerText="$"+risk.toFixed(2);
    s1.innerText="$"+p1.toFixed(2);
    s3.innerText="$"+p3.toFixed(2);
    st.innerText="$"+total.toFixed(2);
    sresult.style.display="block";
}

let data=[];
function growthCalc(){
    let c=parseFloat(gcapital.value), r=parseFloat(grisk.value), t=parseInt(gtrades.value);
    if(!c||!r||!t) return alert("Enter valid numbers");
    data=[];
    gtable.style.display="table";
    let body=document.querySelector("#gtable tbody");
    body.innerHTML="";

    for(let i=1;i<=t;i++){
        let risk=c*(r/100);
        let half=risk/2;
        let p1=half;
        let p3=half*3;
        let profit=p1+p3;
        let end=c+profit;

        data.push({Trade:i,Start:c.toFixed(2),Risk:risk.toFixed(2),OneR:p1.toFixed(2),ThreeR:p3.toFixed(2),Profit:profit.toFixed(2),End:end.toFixed(2)});

        body.innerHTML+=`
        <tr>
            <td>${i}</td>
            <td>$${c.toFixed(2)}</td>
            <td>$${risk.toFixed(2)}</td>
            <td>$${p1.toFixed(2)}</td>
            <td>$${p3.toFixed(2)}</td>
            <td>$${profit.toFixed(2)}</td>
            <td>$${end.toFixed(2)}</td>
        </tr>`;
        c=end;
    }
}

function downloadExcel(){
    if(!data.length) return alert("Calculate first");
    let ws=XLSX.utils.json_to_sheet(data);
    let wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Growth");
    XLSX.writeFile(wb,"RR_Growth.xlsx");
}
</script>

</body>
</html>
